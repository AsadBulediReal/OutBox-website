<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Outbox Downloader — Sign In Complete</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 36px 40px;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin: 0 0 22px; }
    a.btn {
      display: inline-block;
      background: #0ea5e9;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 11px 24px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Returning to Outbox Downloader</h1>
    <p id="msg">Click <strong>Open Outbox Downloader</strong> in your browser prompt to finish signing in.</p>
    <a id="openBtn" class="btn" href="outboxdownloader://oauth/done">Open Outbox Downloader</a>
  </div>
  <script>
    (function () {
      var target = "outboxdownloader://oauth/callback" + (window.location.search || "");
      var btn = document.getElementById("openBtn");
      if (btn) btn.href = target;
      if (window.location.search && window.location.search.indexOf("code=") !== -1) {
        setTimeout(function () { window.location.href = target; }, 120);
      } else {
        var msg = document.getElementById("msg");
        if (msg) msg.textContent = "No authorization parameters were received. Please try signing in again.";
      }
    })();
  </script>
</body>
</html>
