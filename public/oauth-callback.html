<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Connect Dropbox — Outbox Downloader</title>
  <link rel="icon" type="image/svg+xml" href="/outbox_icon.svg" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
    main { box-sizing: border-box; width: min(100% - 2rem, 32rem); padding: 2rem; background: white; border: 1px solid #e2e8f0; border-radius: 1rem; text-align: center; }
    img { width: 3rem; height: 3rem; }
    h1 { font-size: 1.5rem; }
    p { color: #475569; line-height: 1.6; }
    a { display: inline-block; margin-top: .5rem; padding: .75rem 1.25rem; border-radius: .5rem; background: #2563eb; color: white; font-weight: 600; text-decoration: none; }
    a[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <img src="/outbox_icon.svg" alt="" />
    <h1 id="heading">Opening Outbox Downloader</h1>
    <p id="message">Allow your browser to open Outbox Downloader to finish connecting Dropbox.</p>
    <a id="open-app" hidden>Open Outbox Downloader</a>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      // Remove credentials from the address bar and browser history before opening the app.
      window.history.replaceState(null, '', window.location.pathname);
      if (!code || !state || params.has('error')) {
        document.getElementById('heading').textContent = 'Could not connect Dropbox';
        document.getElementById('message').textContent = 'Return to Outbox Downloader and try connecting Dropbox again.';
        return;
      }
      const callback = new URL('outboxdownloader://oauth/callback');
      callback.searchParams.set('code', code);
      callback.searchParams.set('state', state);
      const link = document.getElementById('open-app');
      link.href = callback.toString();
      link.hidden = false;
      window.location.href = link.href;
    })();
  </script>
</body>
</html>
