<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Connect Dropbox — Outbox Downloader</title>
  <link rel="icon" type="image/svg+xml" href="/outbox_icon.svg" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #f6f9fd; color: #14233e; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    .page { flex: 1; display: grid; place-items: center; padding: 2rem 1.25rem 5rem; }
    main { width: min(100%, 31rem); padding: 3.25rem 2.5rem 2.75rem; border: 1px solid #e5ebf3; border-radius: 1.5rem; background: #fff; box-shadow: 0 24px 70px rgba(37, 63, 101, .08), 0 4px 14px rgba(37, 63, 101, .04); text-align: center; }
    .illustration { position: relative; display: grid; place-items: center; width: 6rem; height: 6rem; margin: 0 auto 2rem; border: 1px solid #dbeafe; border-radius: 1.75rem; background: #eff6ff; }
    .illustration img { width: 3rem; height: 3rem; }
    .badge { position: absolute; right: -.4rem; bottom: -.4rem; display: grid; place-items: center; width: 2rem; height: 2rem; border: 3px solid white; border-radius: 50%; background: #2563eb; color: white; }
    .eyebrow { margin: 0 0 .7rem; color: #2563eb; font-size: .7rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.55rem, 5vw, 1.9rem); line-height: 1.2; letter-spacing: -.04em; }
    #message { max-width: 22rem; margin: 1rem auto 0; color: #64748b; font-size: .96rem; line-height: 1.7; }
    #open-app { display: inline-flex; align-items: center; justify-content: center; gap: .65rem; min-height: 3.25rem; margin-top: 2rem; padding: .85rem 1.4rem; border-radius: .75rem; background: #2563eb; box-shadow: 0 5px 14px rgba(37, 99, 235, .22); color: #fff; font-size: .92rem; font-weight: 700; text-decoration: none; transition: background .2s, transform .2s; }
    #open-app:hover { background: #1d4ed8; transform: translateY(-1px); }
    #open-app:focus-visible { outline: 3px solid #93c5fd; outline-offset: 4px; }
    #open-app[hidden] { display: none; }
    .footer { padding: 0 1.5rem 2rem; color: #94a3b8; font-size: .78rem; text-align: center; }
    @media (max-width: 480px) { .page { padding-bottom: 3rem; } main { padding: 2.5rem 1.5rem; } }
    @media (prefers-reduced-motion: reduce) { #open-app { transition: none; } }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <div class="illustration" aria-hidden="true">
        <img src="/outbox_icon.svg" alt="" />
        <span class="badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9" /></svg></span>
      </div>
      <p class="eyebrow">Dropbox connection</p>
      <h1 id="heading">Returning to Outbox Downloader</h1>
      <p id="message">Allow your browser to open Outbox Downloader to finish connecting Dropbox.</p>
      <a id="open-app" hidden>Open Outbox Downloader <span aria-hidden="true">?</span></a>
    </main>
  </div>
  <footer class="footer">Outbox Downloader &nbsp;?&nbsp; Your files, your way.</footer>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      // Remove credentials from the address bar and browser history before opening the app.
      window.history.replaceState(null, '', window.location.pathname);
      if (!code || !state || params.has('error')) {
        document.getElementById('heading').textContent = 'Could not connect Dropbox';
        document.getElementById('message').textContent = 'Return to Outbox Downloader and try connecting Dropbox again.';
        return;
      }
      const callback = new URL('outboxdownloader://oauth/callback');
      callback.searchParams.set('code', code);
      callback.searchParams.set('state', state);
      const link = document.getElementById('open-app');
      link.href = callback.toString();
      link.hidden = false;
      window.location.href = link.href;
    })();
  </script>
</body>
</html>
