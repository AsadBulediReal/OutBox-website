<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/outbox_icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outbox Downloader — Selective Dropbox Downloader & Folder Extractor</title>
    <meta name="description" content="Outbox Downloader: Selective, resumable, and cryptographically verified downloads from Dropbox shared links. Official website: outboxdownloader.com." />
    <link rel="canonical" href="https://outboxdownloader.com/" />
    <meta property="og:title" content="Outbox Downloader — Selective Dropbox Downloader" />
    <meta property="og:description" content="Selective, resumable, and cryptographically verified downloads from Dropbox shared links." />
    <meta property="og:url" content="https://outboxdownloader.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Google Auto Ads Preloader (Activates if publisher ID is saved in localStorage and script is not already injected) -->
    <script>
      (function() {
        if (document.querySelector('script[src*="googlesyndication.com"]')) return;
        var pubId = localStorage.getItem('outbox_adsense_client_id');
        if (pubId && pubId.trim().startsWith('ca-pub-')) {
          var s = document.createElement('script');
          s.async = true;
          s.crossOrigin = 'anonymous';
          s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + pubId.trim();
          document.head.appendChild(s);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#060913] text-slate-900 dark:text-slate-100 antialiased font-sans selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
